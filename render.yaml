services:
  - type: web
    name: ranbank-future-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "/api"
      - key: RANBANK_BACKEND_URL
        value: "https://ranbank-api.onrender.com/api"

  - type: web
    name: ranbank-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: "postgresql"
      - key: DATABASE_URL
        fromDatabase:
          name: ranbank-postgres
          property: connectionString
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: "https://ranbank-future-lab.onrender.com"

databases:
  - name: ranbank-postgres
    plan: free
    databaseName: ranbank
    user: ranbank
