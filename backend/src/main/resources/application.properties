spring.application.name=ranbank-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ranbank;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
ranbank.chat.mode=local
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}
ranbank.demo.login-id=${RANBANK_DEMO_LOGIN_ID:12345678909}
ranbank.demo.access-pin=${RANBANK_DEMO_ACCESS_PIN:2580}
ranbank.demo.transaction-pin=${RANBANK_DEMO_TRANSACTION_PIN:7314}
ranbank.session.minutes=${RANBANK_SESSION_MINUTES:30}
ranbank.proxy.secret=${RANBANK_PROXY_SECRET:}
