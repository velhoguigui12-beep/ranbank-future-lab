spring.application.name=ranbank-api
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/ranbank;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
ranbank.chat.mode=local
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,https://*.chatgpt.site}
ranbank.demo.login-id=${RANBANK_DEMO_LOGIN_ID:12345678909}
ranbank.demo.access-pin=${RANBANK_DEMO_ACCESS_PIN:2580}
ranbank.demo.transaction-pin=${RANBANK_DEMO_TRANSACTION_PIN:7314}
ranbank.session.minutes=${RANBANK_SESSION_MINUTES:30}
